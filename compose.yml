version: '3.8'

services:
  yoloraker:
    build: .
    container_name: YoloRaker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Data adresář (obsahuje H2 databázi, hesla, profily, snapshoty a nahrané modely)
      - ./data:/data

    environment:
      # Nastavení časového pásma pro správný čas v grafech a historii
      - TZ=Europe/Prague
      # Vynucení ukládání databáze do kořenové složky /data uvnitř kontejneru
      - YOLORAKER_DB_PATH=/data/yoloraker
      # Cesta pro snapshoty a nahrané AI modely – musí ukazovat na připojený volume,
      # jinak se timelapse i vlastní modely po restartu kontejneru ztratí.
      - YOLORAKER_DATA_PATH=/data
